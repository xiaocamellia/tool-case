name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHON_VERSION: "3.12.7"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Verify dependency locks
        run: python scripts/verify_lock_hash.py

      - name: Rebuild locked build environment
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -r requirements.lock
          python -m pip install --no-deps -r requirements-build.lock
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Quality gate
        shell: powershell
        run: |
          python -m pytest -q -W error
          python -m radar_tool.run --smoke-test
          python -m compileall -q radar_tool tests scripts

      - name: Load code-signing certificate
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw "WINDOWS_CERTIFICATE_BASE64 is required for release builds."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required for release builds."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "portable-radar-toolbox.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          [IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)`n",
            [Text.UTF8Encoding]::new($false)
          )
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Build signed standalone release
        shell: powershell
        run: |
          .\packaging\nuitka\build.ps1 `
            -Python python `
            -Version "1.0.0" `
            -CertificateThumbprint $env:WINDOWS_CERTIFICATE_THUMBPRINT `
            -SkipTests

      - name: Malware scan
        shell: powershell
        run: |
          $releaseRoot = (Resolve-Path ".\artifacts\nuitka").Path
          Start-MpScan -ScanType CustomScan -ScanPath $releaseRoot

      - name: Upload build record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PortableRadarToolbox-win64
          path: |
            artifacts/nuitka/PortableRadarToolbox-1.0.0-win64.zip
            artifacts/nuitka/PortableRadarToolbox-1.0.0-win64.zip.sha256
            artifacts/nuitka/build-*.log
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(
            "artifacts/nuitka/PortableRadarToolbox-1.0.0-win64.zip",
            "artifacts/nuitka/PortableRadarToolbox-1.0.0-win64.zip.sha256"
          )
          if (gh release view $env:GITHUB_REF_NAME 2>$null) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          }
          else {
            gh release create $env:GITHUB_REF_NAME @assets `
              --title $env:GITHUB_REF_NAME `
              --notes "Signed Windows standalone release with SBOM and build manifest."
          }
