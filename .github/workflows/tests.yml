name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Verify dependency lock
        run: python scripts/verify_lock_hash.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Install locked runtime dependencies
        run: python -m pip install -r requirements.lock
      - name: Ruff
        run: ruff check --select E9,F63,F7,F82 radar_tool tests
      - name: Mypy
        run: mypy --ignore-missing-imports radar_tool scripts
      - name: pip-audit
        run: >-
          pip-audit -r requirements.lock
          --no-deps --disable-pip
          --index-url https://pypi.org/simple
          --progress-spinner off
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -W error
      - name: Packaging smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m radar_tool.run --smoke-test
